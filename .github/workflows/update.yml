name: Update

on:
  schedule:
    # Twice a day, off the top of the hour, where GitHub delays or drops
    # scheduled runs the most.
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to update (space-separated, empty for all; nixpkgs for the nixpkgs, nix-darwin and home-manager inputs)"
        required: false
        default: ""

# One run at a time, so a manual run waits for a scheduled one instead of
# racing its push.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

env:
  # These run as root (the Office apps: their licensing helper), filter the
  # network, or are agents acting with the user's access: their updates go
  # through a pull request (branch update/<name>), which check.yml merges
  # once every system builds it, instead of straight to main from this
  # Linux-only run.
  REVIEW: "1mcp claude-code claude-desktop cloudflare-warp codex cua-driver google-drive hermes-agent kiri littlesnitch microsoft-excel microsoft-powerpoint microsoft-word muxin nullclaw opencode pi rayfish santa tailscale telegram whatsapp zed"

jobs:
  # Every package that builds on Linux, and nixpkgs weekly. See
  # lib/update-all.sh.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      # To start check.yml on update/<name>: pushes made with this token
      # start no workflows, but a dispatch does.
      actions: write
    env:
      # Only whether the secret is set; the token itself goes to the push step.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the rebase before the push always finds its base.
          fetch-depth: 0
          # The update step pushes with GH_TOKEN (lib/update-all.sh), so the
          # token isn't left in .git/config for the later steps.
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Pull from ret.cachix.org, which is public: no token needed.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ret
          skipPush: true

      - name: Update packages
        env:
          # For gh, and for git through gh's credential helper.
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ github.event.inputs.packages }}
          UPDATE_SYSTEM: x86_64-linux
        run: lib/update-all.sh

      # Only hermes-agent's and llama's runtime closures, as main now has them;
      # paths already on cache.nixos.org are skipped. Runs after a failed update
      # too.
      - name: Push hermes-agent and llama to Cachix
        if: ${{ !cancelled() && env.HAS_CACHIX == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build .#hermes-agent .#llama --no-link --print-out-paths | cachix push ret

  # The packages that build only on macOS, built there before they land, on
  # top of what the Linux job pushed.
  update-darwin:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      # To start check.yml on update/<name>: pushes made with this token
      # start no workflows, but a dispatch does.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Compute macOS cache key
        id: macos-cache
        run: |
          key="$(lib/macos-cache-key.sh)"
          echo "key=$key" >>"$GITHUB_OUTPUT"
      # Keyed on the macOS derivations, so Linux-only changes keep the
      # cache. Heavy packages (the Office apps) are deleted from the store
      # once built (lib/update-all.sh), so they never fill it.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-v2-${{ steps.macos-cache.outputs.key }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-v2-
          gc-max-store-size-macos: 4G
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ret
          skipPush: true
      # macOS ships bash 3.2 and BSD tools; the update scripts run with
      # nixpkgs' bash and GNU tools, as on Linux.
      - name: Update packages
        env:
          # For gh, and for git through gh's credential helper.
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ github.event.inputs.packages }}
          UPDATE_SYSTEM: aarch64-darwin
        run: >-
          nix shell --inputs-from . nixpkgs#bash nixpkgs#coreutils
          nixpkgs#gnugrep nixpkgs#gnused --command lib/update-all.sh
