name: Cache

# Pushes the packages that compile for minutes (ci/cached-packages.sh:
# hermes-agent, x86_64 only, and llama) to nan.cachix.org, as main has
# them, and only those nan.cachix.org doesn't hold yet: a change that leaves
# them alone builds nothing. Only from main: builds of pull requests and
# update/<name> branches never reach the cache. Runs on a push to main (a
# merged pull request), and is started by update.yml and check.yml's merge
# job after they land an update, since what they push or merge with their
# token starts no workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer main replaces an older one's builds. A manual run on a branch
# can test a cached launcher independently of publishing from main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'cache' || format('cache-smoke-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Evaluation and cache lookups only, for both Linux systems. Without a
  # Cachix token (a fork) there is nothing to push, so nothing to build.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only whether the secret is set; the token itself goes to the push step.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      nixos-shell: ${{ steps.nixos-shell.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      - name: List the cached packages nan.cachix.org lacks
        id: plan
        if: env.HAS_CACHIX == 'true'
        run: ci/cache-plan.sh
      - name: Check the NixOS shell launcher cache
        id: nixos-shell
        if: env.HAS_CACHIX == 'true'
        run: |
          launcher="$(nix eval --raw .#packages.aarch64-darwin.nixos-shell.outPath)"
          if ! nix path-info --store https://nan.cachix.org "$launcher"; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    name: push (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      # Pull from nan.cachix.org, which is public: no token needed.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nan
          skipPush: true
      - name: Build the missing packages
        env:
          SYSTEM: ${{ matrix.system }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          installables=()
          for name in $PACKAGES; do
            installables+=(".#packages.$SYSTEM.\"$name\"")
          done
          nix build --no-link -L "${installables[@]}"
      # Their runtime closures; paths already on cache.nixos.org are skipped.
      - name: Push them to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.system }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          installables=()
          for name in $PACKAGES; do
            installables+=(".#packages.$SYSTEM.\"$name\"")
          done
          nix build --no-link --print-out-paths "${installables[@]}" | cachix push nan

  nixos-shell-guest:
    needs: plan
    if: needs.plan.outputs.nixos-shell == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
          # The guest's Determinate Nix from Determinate's public binary
          # cache, so it isn't compiled here; the guest's closure, that Nix
          # included, is then pushed to nan.cachix.org.
          extra-conf: |
            extra-substituters = https://install.determinate.systems
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nan
          skipPush: true
      - name: Build the NixOS guest
        id: guest
        run: |
          paths="$(nix build --no-link -L --print-out-paths \
            .#nixosConfigurations.nixos-shell.config.system.build.toplevel \
            .#nixosConfigurations.nixos-shell.config.system.build.initialRamdisk)"
          {
            echo 'paths<<EOF'
            echo "$paths"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish the guest
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          STORE_PATHS: ${{ steps.guest.outputs.paths }}
        run: cachix push nan <<< "$STORE_PATHS"

  nixos-shell-launcher:
    needs: nixos-shell-guest
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nan
          skipPush: true
      - name: Build the macOS launcher using the cached guest
        id: launcher
        run: |
          path="$(nix build --no-link -L --print-out-paths --builders "" .#nixos-shell)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Publish the launcher
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          STORE_PATH: ${{ steps.launcher.outputs.path }}
        run: cachix push nan "$STORE_PATH"

  nixos-shell-smoke:
    needs: nixos-shell-launcher
    if: ${{ !cancelled() && (needs.nixos-shell-launcher.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nan
          skipPush: true
      - name: Boot the cached guest with no builders
        env:
          # Hosted macOS runners can return HV_UNSUPPORTED from nested HVF.
          QEMU_OPTS: "-machine accel=tcg"
        run: |
          nix_version="$(nix --version)"
          echo "$nix_version"
          if [[ "$nix_version" != *"Determinate Nix"* ]]; then
            echo "Expected Determinate Nix on the macOS runner" >&2
            exit 1
          fi
          checkout="$PWD"
          cd "$(mktemp -d "$RUNNER_TEMP/nixos-shell.XXXXXXXX")"
          /usr/bin/expect "$checkout/ci/nixos-shell-smoke.exp" "github:$GITHUB_REPOSITORY/$GITHUB_SHA#nixos-shell"
