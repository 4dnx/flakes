name: Microsoft Office

# Builds the Office apps (microsoft-excel, microsoft-powerpoint,
# microsoft-word) for aarch64-darwin, their only system, only when asked:
# on a pull request to main that changes them and carries the
# `build-office` label, or from Run workflow on a branch. checks leave them
# out (flake.nix `heavy`: each downloads a ~1.4 GB installer and takes ~3 GB
# built), so a pull request doesn't wait for that download unless it asks.
# A plan job on Linux compares their derivations with main (a pull
# request's base), so only the apps whose derivation changed are built (all
# of them when their shared builder changed), and a change to the module or
# docs alone starts no macOS runner.
#
# Not a required check: it doesn't run on most pull requests, which would
# then wait for it forever.
#
# Pull requests that update.yml opens (update/<name>) get no run: GitHub
# holds pull_request runs of that token's pull requests for approval, and
# ci/update-all.sh and check.yml delete them. update.yml's macOS job builds
# each bump itself before proposing it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # labeled: adding `build-office` starts the build.
    types: [opened, synchronize, reopened, labeled]
    paths:
      # The apps, pkgs/microsoft-office (their builder and update script,
      # which only they use) and the shared files their builds read.
      - "pkgs/microsoft-*/**"
      - "verify/check-app.py"
      - "verify/apple-root-ca.pem"
      - "verify/office-pkg-signature-check.py"
      - ".github/workflows/microsoft-office.yml"

concurrency:
  group: microsoft-office-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    # A dispatch, or a pull request labeled `build-office` (on a labeled
    # event, only when that label is the one added).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'build-office') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build-office'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch too, to compare against.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Evaluation only: the apps' aarch64-darwin derivations here and on
      # the base branch. A base without them (or that doesn't evaluate)
      # builds them all.
      - name: Plan the Office builds
        id: plan
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          drvs() {
            nix eval --json "$1#packages.aarch64-darwin" --apply '
              ps: builtins.mapAttrs (n: p: p.drvPath) {
                inherit (ps) microsoft-excel microsoft-powerpoint microsoft-word;
              }'
          }
          head="$(drvs "git+file://$PWD")"
          base="$(drvs "git+file://$PWD?shallow=1&rev=$(git rev-parse "$BASE")")" || base='{}'
          packages="$(jq -rn --argjson h "$head" --argjson b "$base" \
            '[$h | to_entries[] | select($b[.key] != .value) | .key] | join(" ")')"
          echo "To build: ${packages:-nothing}"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

  # One package at a time, each deleted from the store before the next, so
  # the runner needs room for one app (installer, app, Nix's copy of the
  # download: ~5 GB), not all of them.
  build:
    name: build (aarch64-darwin)
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the changed Office apps
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          df -h /nix
          for name in $PACKAGES; do
            attr=".#packages.aarch64-darwin.$name"
            nix build --no-link -L "$attr"
            df -h /nix
            # shellcheck disable=SC2046 # store paths, one per word
            nix store delete $(nix eval --raw "$attr" \
              --apply 'p: toString (map (o: builtins.getAttr o p) p.outputs ++ [ p.src ])')
          done
