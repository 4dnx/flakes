name: Check

on:
  # main gets no run of its own: a pull request is checked at its head
  # (below), which is the tree that lands once it contains main (the merge
  # job ensures that for update branches), and cache.yml pushes the cached
  # packages.
  pull_request:
  workflow_dispatch:

concurrency:
  # PR checks cannot cancel the dispatched run that merges update branches.
  group: check-${{ github.event_name == 'pull_request' && 'pr' || 'branch' }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Determinate Nix's telemetry and crash reports off for the nix commands
# the steps run; ci/determinate-telemetry-off.sh does the same for the
# daemon.
env:
  DETSYS_IDS_TELEMETRY: disabled
  NIX_SENTRY_ENDPOINT: ""

jobs:
  # Which checks each system builds, worked out on Linux: those whose
  # derivation differs from a successful run of an ancestor (ci/check-plan.sh),
  # so a system the change leaves alone starts no runner, and a macOS runner,
  # which takes longer to get and to set up, starts only for macOS changes.
  # No trustworthy baseline means building every check. Also evaluates every
  # package and checks the formatting.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # To list the successful Check runs.
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's head, not GitHub's merge commit with its base:
          # the commit the run reports, so a later plan can take it as its
          # baseline.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The history, to find the baseline among the ancestors.
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      - name: Turn Determinate Nix's telemetry off
        run: ci/determinate-telemetry-off.sh
      - name: Plan the checks of each system
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ci/check-plan.sh

  # One runner per system with checks to build, building just those. No store
  # cache between runs: most packages here are upstream's binaries, and
  # restoring and saving a store took longer than fetching what a few
  # changed checks need. Linux pulls the packages that compile for minutes
  # from ret.cachix.org (ci/cached-packages.sh), which holds nothing for
  # macOS.
  build:
    name: check (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          # Installer diagnostics stay off.
          diagnostic-endpoint: ""
      - name: Turn Determinate Nix's telemetry off
        run: ci/determinate-telemetry-off.sh
      # Pull from ret.cachix.org, which is public: no token needed.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: runner.os == 'Linux'
        with:
          name: ret
          skipPush: true
      # --keep-going reports every failing check, not just the first.
      - name: Build the checks that differ from the baseline
        env:
          SYSTEM: ${{ matrix.system }}
          CHECKS: ${{ matrix.checks }}
        run: |
          installables=()
          for check in $CHECKS; do
            installables+=(".#checks.$SYSTEM.\"$check\"")
          done
          nix build --no-link --keep-going -L "${installables[@]}"

  # One status for every system, for the merge job below. Not required by a
  # branch rule: one would also reject update.yml's direct pushes to main.
  validated:
    name: Validate all systems
    needs: [plan, build]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          [[ "$PLAN" == success ]]
          [[ "$BUILD" == success || ( "$BUILD" == skipped && "$MATRIX" == "[]" ) ]]

  # An update/<name> branch that update.yml proposed and every system above
  # built (a system may be skipped, but only when the plan found nothing for
  # it to build): merge its pull request (ci/merge-update.sh), unless the
  # branch moved on since this run started, or rebase it onto main and check
  # it again when main has moved past it. Only a dispatch from update.yml (or
  # someone with write access) runs this, never a pull_request event.
  # GitHub's merge queue is not available to repositories owned by a user
  # account, so this merges directly.
  merge:
    needs: validated
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/update/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To start cache.yml, or this workflow again after a rebase: merges and
      # pushes with this token start no workflow themselves.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The script pushes through gh's credential helper with GH_TOKEN.
          persist-credentials: false
      # The token goes only to this step, as the secrets above do.
      - name: Merge the update's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: ci/merge-update.sh
